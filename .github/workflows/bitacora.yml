name: Publicar la bitácora en GitHub Pages

# Publica en la rama gh-pages (Settings > Pages > Source: Deploy from a branch > gh-pages):
# - main      → la página normal: https://amongoooo.github.io/RESONANCE/
# - cada PR   → su vista previa:  https://amongoooo.github.io/RESONANCE/pr-preview/pr-N/
#               (el bot deja el link en la PR y la borra al mezclarla o cerrarla).
# Solo corre cuando cambia la bitácora: los cambios del proyecto de Unity no la vuelven a publicar.
on:
  push:
    branches: [main]
    paths:
      - 'bitacora/**'
      - '.github/workflows/bitacora.yml'
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'bitacora/**'
      - '.github/workflows/bitacora.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Una fila por destino: main por un lado y cada PR por el suyo.
# GitHub deja una sola ejecución en espera por fila y cancela la que esperaba si llega otra.
# Con una sola fila para todo, la limpieza de una PR cerrada cancelaba la publicación de main
# (pasó el 25 de nov. al fusionar #11, #12 y #13 seguidas). Así una ejecución solo reemplaza
# a otra del mismo destino, que trae lo más nuevo. Si dos filas escriben gh-pages a la vez,
# las dos acciones de publicar reintentan sobre lo más reciente (attempt-limit, 3 por omisión).
concurrency:
  group: gh-pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bitacora/package-lock.json

      - name: Instalar, probar y compilar
        if: github.event.action != 'closed'
        working-directory: bitacora
        run: |
          npm ci
          npm test
          npm run build
          touch dist/.nojekyll

      - name: Publicar la página (main)
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: bitacora/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      - name: Vista previa de la PR
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: bitacora/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
