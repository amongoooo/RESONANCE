<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RESONANCIA: registro del proyecto</title>
    <meta name="description" content="Registro de desarrollo de RESONANCIA, un plataformero educativo de física del sonido." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RESONANCIA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2310121c'/%3E%3Cpath d='M2 8 Q4 2 6 8 T10 8 T14 8' fill='none' stroke='%2336c5f4' stroke-width='1.6'/%3E%3C/svg%3E" />
    <script>
      // Ajustes antes de pintar (sin destello). Lo mismo que src/logica/opciones.js > aplicar.
      try {
        const o = JSON.parse(localStorage.getItem('resonancia:opciones') || '{}')
        const t = o.tema || localStorage.getItem('resonancia:tema') || 'sistema'
        const html = document.documentElement
        if (t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)) html.classList.add('dark')
        if (o.letra === 'grande') html.classList.add('letra-grande')
        if (o.vidrio === 'opaco') html.classList.add('opaco')
        // «Al abrir: la última que viste»: solo si se abrió sin dirección (#) propia.
        if (o.abrir === 'ultima' && !location.hash) {
          const u = localStorage.getItem('resonancia:ultima')
          if (u) history.replaceState(null, '', u)
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-CocYTEx4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B0oC8uI_.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
